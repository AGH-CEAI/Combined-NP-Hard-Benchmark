[project]
name = "combined-np-hard-benchmark"
version = "0.1.0"
description = "NP-hard benchmark instances with MATILDA/SATzilla features and a Python API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# folders contain tens of thousands of instance files; only look where tests live
testpaths = [
    "test_benchmark.py",
    "Bin-Packing-1D",
    "Bin-Packing-2D",
    "GCP",
    "Knapsack problem",
    "QAP",
    "SAT",
    "TSP",
    "Timetabling",
]
python_files = ["test_*.py"]
